<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SwitchMarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2.0.5/dist/tonconnect-ui.min.js"></script>
</head>
<body>
<div id="app">

<header class="topbar" id="topbar">
  <div class="topbar-brand">
    <span class="brand-mark"></span>
    <span class="brand-name">SwitchMarket</span>
  </div>
  <nav class="topbar-nav" id="topbarNav">
    <button class="nav-item active" data-route="catalog">Торговля</button>
    <button class="nav-item" data-route="deals">Сделки</button>
    <button class="nav-item" data-route="gifts">Инвентарь</button>
    <button class="nav-item" data-route="disputes" data-role="arbiter">Споры</button>
    <button class="nav-item" data-route="profile">Профиль</button>
  </nav>
  <div class="topbar-balance">
    <span class="balance-value" id="balanceValue">0.00</span>
    <span class="balance-unit">GRAM</span>
  </div>
</header>

<div class="island mode-nav" id="island">
  <div class="island-expanded" id="islandExpanded">
    <span class="island-brand-dot"></span>
    <span class="island-brand-text">SwitchMarket</span>
  </div>
  <div class="island-collapsed" id="islandCollapsed">
    <button class="island-top-btn" id="islandTopBtn" aria-label="Наверх">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>
    <span class="island-tab-name" id="islandTabName">Маркет</span>
    <span class="island-status-dot" id="islandStatusDot"></span>
  </div>
</div>

<main class="screen" id="screen"></main>

<nav class="bottombar" id="bottombar">
  <button class="bottom-btn" data-route="gifts" aria-label="Инвентарь">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 12 20 22 4 22 4 12"></polyline>
      <rect x="2" y="7" width="20" height="5"></rect>
      <line x1="12" y1="22" x2="12" y2="7"></line>
      <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
      <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
    </svg>
  </button>

  <div class="bottom-center-group">
    <button class="bottom-btn" data-route="deals" aria-label="Сделки">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="17 1 21 5 17 9"></polyline>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
        <polyline points="7 23 3 19 7 15"></polyline>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
      </svg>
    </button>
    <button class="bottom-btn" id="bottomMarketBtn" data-route="catalog" aria-label="Торговля">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <path d="M16 10a4 4 0 0 1-8 0"></path>
      </svg>
    </button>
  </div>

  <button class="bottom-btn bottom-btn-profile" data-route="profile" aria-label="Профиль">
    <span class="bottom-balance-badge" id="bottomBalanceBadge">0 GRAM</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
  </button>
</nav>

</div>

<template id="tpl-listing-card">
  <article class="listing-card">
    <div class="listing-media">
      <img class="listing-image" alt="">
      <span class="listing-rarity"></span>
    </div>
    <div class="listing-body">
      <h3 class="listing-title"></h3>
      <div class="attribute-row"></div>
      <div class="listing-seller">
        <span class="seller-name"></span>
        <span class="seller-badge"></span>
      </div>
      <div class="listing-footer">
        <div class="listing-price"><span class="price-value"></span><span class="price-unit">GRAM</span></div>
        <button class="btn btn-primary btn-buy">Купить через Гарант</button>
      </div>
    </div>
  </article>
</template>

<template id="tpl-inventory-card">
  <article class="inventory-card">
    <div class="listing-media">
      <img class="listing-image" alt="">
    </div>
    <div class="listing-body">
      <h3 class="listing-title"></h3>
      <div class="attribute-row"></div>
      <div class="inventory-actions">
        <input class="price-input" type="number" min="1" step="0.01" placeholder="Цена в GRAM">
        <button class="btn btn-primary btn-list">Выставить</button>
      </div>
    </div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
